[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loom-ffi"
version = "2026.10.20.3"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "typing_extensions",
    "pyyaml",
    "devtools",
    "ninja",
    "pip>=26.2.1",
]

[project.optional-dependencies]
jax = ["jax"]
torch = ["torch"]
# the pip CUDA compiler, pinned: the 13.4 frontend collapses on our kernels, 13.3 works
cuda = ["nvidia-cuda-nvcc>=13.3,<13.4", "nvidia-cuda-crt<13.4", "nvidia-nvvm<13.4"]

[project.scripts]
loom-toolchain = "loom.toolchain:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loom"]


[tool.hatch.build.targets.sdist]
only-include = [
    "src",
]
