[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loom"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "typing_extensions",
    "pyyaml",
    "devtools",
    "ninja",
    "pip>=26.2.1",
]

[project.optional-dependencies]
jax = ["jax"]
torch = ["torch"]
# the pip CUDA compiler, pinned: the 13.4 frontend collapses on our kernels, 13.3 works
cuda = ["nvidia-cuda-nvcc>=13.3,<13.4", "nvidia-cuda-crt<13.4", "nvidia-nvvm<13.4"]

[project.scripts]
loom-toolchain = "loom.toolchain:main"
# build the catalogue of precompiled kernels from any build system:
# it is the artifact through which an external project produces its kernels ahead of time rather than
# at run time -- see `loom/compilation/cli.py`
loom-kernels = "loom.compilation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loom"]

[tool.hatch.build.targets.wheel.force-include]
"include" = "loom/_include"
"cpp" = "loom/_cpp"

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "include",
    "cpp",
]
