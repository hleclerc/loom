[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loom-ffi"
version = "2026.11.08.1"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "ninja",
]

[project.optional-dependencies]
jax = ["jax"]
torch = ["torch"]
# `loom.util.info`, the debug printer ( names and colours of the arguments )
dev = ["devtools"]
# the pip CUDA compiler, pinned: the 13.4 frontend collapses on our kernels, 13.3 works
cuda = ["nvidia-cuda-nvcc>=13.3,<13.4", "nvidia-cuda-crt<13.4", "nvidia-nvvm<13.4", "nvidia-cuda-cccl<13.4"]   # ( CCCL: the CUB of the 1D kernels, and the one Jax brings )

[project.scripts]
loom-toolchain = "loom.toolchain:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loom"]


[tool.hatch.build.targets.sdist]
only-include = [
    "src",
]
