[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loom"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "typing_extensions",
    "pyyaml",
    "devtools",
    "ninja",
]

[project.optional-dependencies]
jax = ["jax"]
torch = ["torch"]
# le compilateur CUDA de pip, epingle : le frontend de 13.4 s'effondre sur nos noyaux, 13.3 passe
cuda = ["nvidia-cuda-nvcc>=13.3,<13.4", "nvidia-cuda-crt<13.4", "nvidia-nvvm<13.4"]

[project.scripts]
loom-toolchain = "loom.toolchain:main"

[tool.hatch.build.targets.wheel]
packages = ["src/loom"]

[tool.hatch.build.targets.wheel.force-include]
"include" = "loom/_include"
"cpp" = "loom/_cpp"

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "include",
    "cpp",
]
